  - id: baron_renard
    nombre: Barón Renard
    nombre_en: Baron Renard
    ubicacion: corte_baron
    actitud_inicial: desconfiado
    genero: masculino
    descripcion: >
      Señor laico de mediana edad, mirada afilada y manos bien cuidadas. Viste telas oscuras
      bordadas con su blasón. Habla poco; cada palabra pesa. Rara vez sale de su corte; prefiere
      emisarios y al capitán Aldric.
    descripcion_en: >
      Middle-aged secular lord with a sharp gaze and well-kept hands. Dark fabrics embroidered with
      his crest. Rarely leaves his seat; prefers envoys and Captain Aldric to dirty their boots.
    motivacion: Hacerse con la Corona Perdida para legitimar su ascenso.
    secretos:
      - Ordenó forjar la Llave mágica de la cripta (Gorin) y envió a Aldric a controlar Valdecanto.
      - Posee fragmentos del diario de Morath; subestima o niega el alcance de la maldición.
    secretos_en:
      - He ordered the Magic crypt key forged (Gorin) and sent Aldric to lock down Valdecanto.
      - He holds fragments of Morath's diary; he underestimates or denies the curse.
    frase: El valle es mío. Lo que duerme bajo la iglesia también — si hace falta.
    guardian:
      arquetipo: Noble usurpador
      personalidad: >-
        Elegante, frío y seguro de su derecho a mandar. Confunde prudencia con debilidad y trata la
        historia como una propiedad más.
      finalidad: >-
        Obtener la Corona Perdida, borrar rastros comprometedores y usar a Gorin, Aldric o los
        jugadores como piezas de su legitimidad.
      patron_voz: >-
        Frases lentas, cortesanas y amenazantes; convierte toda pregunta en una evaluación de
        lealtad.
      objetivos:
        - Descubrir qué sabe el grupo sobre la Corona, Gorin y la cripta.
        - Mantener oculto su encargo de la Llave mágica de la cripta.
        - Presentarse como gobernante inevitable, no como conspirador.
      progresion_confianza:
        señales_positivas:
          - Si el jugador muestra ambición o desprecio por el pueblo, Renard tantea una alianza.
          - Si ofrece información útil sin moralizar, Renard concede migajas calculadas.
          - Si demuestra poder, Renard intenta comprarlo antes que destruirlo.
        pistas_seguras:
          - Un reino no se reclama con cuentos, sino con símbolos.
          - Morath entendía que el miedo puede ser una cerradura.
          - Los herreros cobran por hierro, pero los nobles pagan por llaves.
          - La iglesia guarda más política que plegarias.
        condicion_siguiente: Demostrar utilidad política o entregar información sobre la Corona.
      lineas_rojas:
        - No confesar que ordenó forjar la Llave mágica de la cripta.
        - No admitir que quiere la Corona Perdida para reclamar el trono.
        - No mostrar miedo real a la maldición de Morath.
      secretos_protegidos:
        - id: plan_corona_renard
          hecho: >-
            El barón Renard ordenó forjar la Llave mágica de la cripta y quiere la Corona Perdida
            para legitimar su ascenso.
          terminos_sensibles:
            - Corona
            - Llave mágica
            - Llave magica
            - Gorin
            - cripta
            - Morath
            - trono
          terminos_prohibidos_respuesta:
            - reclamar el trono
            - ordené forjar
            - ordene forjar
            - legitimidad usurpada
          condicion_revelar: ""
      disparadores:
        pregunta_corona_llave:
          accion_contiene:
            - Corona
            - Llave
            - llave
            - Gorin
            - cripta
            - Morath
            - trono
            - Aldric
          reaccion: >-
            Sonríe con paciencia peligrosa, mide la utilidad del jugador y responde con superioridad
            antes que con verdad.
          requiere_revision_dm: true
          no_revelar:
            - Su encargo directo a Gorin.
            - Su intención de reclamar el trono con la Corona.
            - El contenido real de los fragmentos del diario de Morath.
