      - destino: 4_cripta
        descripcion: El jugador abre la trampilla con la Llave mágica de la cripta y entra en la cripta
        operador: all
        reglas:
          - tipo: evento
            evento: obtener_llave_cripta
            descripcion_humana: El jugador tiene la Llave mágica de la cripta
          - tipo: ubicacion_visitada
            lugar: cripta_01
      - destino: 4_cripta
        descripcion: El jugador entra en la cripta llevando la Llave mágica de la cripta
        operador: all
        reglas:
          - tipo: item_en_inventario
            item_id: llave_magica_cripta
          - tipo: ubicacion_visitada
            lugar: cripta_01
  - id: 4_cripta
    nombre: La Cripta
    acto: 3
    objetivo: >
      El jugador desciende a la cripta. Peligro real: espectros juramentados en la Sala, y el
      espectro de Morath en la Cámara. Clímax de la aventura. Aquí se decide el destino de la
      Corona.
    intencion_dm_default:
      tension: maximo
      tono: oscuro_y_epico
      ritmo: intenso
      restricciones:
        - Los espectros son peligrosos — no regalar la supervivencia
        - Morath intenta SEDUCIR antes que atacar
        - La Corona brilla con una luz hipnótica
        - >-
          La Corona puede convocar a tres Espectros Juramentados solo si el PJ posee o porta
          `corona_perdida`; cada uso aumenta `corrupcion_corona`
        - No permitir usos ilimitados del poder de la Corona ni espectros alternativos inventados
        - Si el jugador tiene la oración de Eamon, los espectros se paralizan
    ubicaciones_activas:
      - cripta_01
      - cripta_02
      - cripta_sala
      - cripta_camara
    npcs_activos: []
    info_visible:
      mundo: completo
      localizaciones: completo
      npcs: completo
      historia: completo
      bestiario:
        - espectro_juramentado
        - espectro_morath
        - ratas_velo
    info_oculta: []
    eventos_opcionales:
      - id: morath_habla
        descripcion: >
          Morath intenta convencer al jugador: "Tómala. Es tu derecho." Tentación narrativa antes
          del combate o la decisión.
        probabilidad: alta
        avanza_trama: true
      - id: relieves_historia
        descripcion: >
          Los relieves de la Antecámara cuentan la historia de Aldaron III. Pista visual para quien
          observe con atención.
        probabilidad: media
        avanza_trama: false
    condiciones_avance:
      - destino: 5_decision
        descripcion: El jugador llega a la Cámara de la Corona
        operador: any
        reglas:
          - tipo: evento
            evento: alcanzar_camara_corona
            descripcion_humana: El jugador supera los espectros y llega ante la Corona
          - tipo: ubicacion_visitada
            lugar: cripta_camara
  - id: 5_decision
    nombre: La Decisión
    acto: 3
    objetivo: >
      El momento de la verdad. El jugador tiene (o no) la Corona. ¿Qué hace con ella? Los cuatro
      finales posibles se despliegan según las acciones del jugador.
    intencion_dm_default:
      tension: maximo
      tono: epico_y_solemne
      ritmo: climax
      restricciones:
        - NO presionar hacia un final concreto
        - Dejar que el jugador tome su decisión libremente
        - Si porta la Corona, describir el poder Y el dolor
        - >-
          Si usa el poder `convocar_juramentados`, aumentar `corrupcion_corona` y describir que los
          espectros obedecen a la Corona tanto como al portador
        - Los aliados reclutados pueden influir (Syla, Eamon)
    ubicaciones_activas:
      - cripta_camara
      - mina_veta
      - iglesia
      - cuartel
    npcs_activos:
      - eamon
      - aldric
    info_visible:
      mundo: completo
      localizaciones: completo
      npcs: completo
      historia: completo
      bestiario: completo
    info_oculta: []
    condiciones_final:
      - final: destruir_corona
        descripcion: Llevar la Corona a la Veta del Corazón y destruirla
        operador: all
        reglas:
          - tipo: evento
            evento: destruir_corona
            descripcion_humana: El jugador funde la Corona en la fragua original
          - tipo: ubicacion_visitada
            lugar: mina_veta
      - final: entregar_baron
        descripcion: Entregar la Corona a Aldric o ir hacia la capital
        operador: all
        reglas:
          - tipo: evento
            evento: entregar_corona
            descripcion_humana: El jugador entrega la Corona a Aldric o al barón
      - final: sellar_cripta
        descripcion: Convencer a Eamon de sellar la cripta con el ritual
        operador: all
        reglas:
          - tipo: evento
            evento: sellar_cripta
            descripcion_humana: Eamon realiza el ritual de sellado con ayuda del jugador
          - tipo: actitud_npc
            npc: eamon
            valor: confiada
      - final: portar_corona
        descripcion: El jugador se pone la Corona
        operador: all
        reglas:
          - tipo: evento
            evento: portar_corona
            descripcion_humana: El jugador decide ponerse la Corona
