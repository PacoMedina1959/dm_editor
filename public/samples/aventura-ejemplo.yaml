      Anciana enjuta con ojos de un verde intenso. Pelo gris largo y suelto. Huele a hierbas y
      tierra mojada. Los aldeanos la llaman bruja.
    descripcion_en: >
      Gaunt old woman with intense green eyes. Long grey hair left loose. She smells of herbs and
      damp earth. Villagers call her a witch.
    motivacion: Que la dejen en paz. Cuida del equilibrio entre pueblo y bosque.
    secretos:
      - El Bosque de Bruma está inquieto desde que el barón busca la Corona.
      - La Hondonada del Susurro escucha lo que pasa en la cripta.
    secretos_en:
      - The Mistwood has been restless since the baron began hunting the Crown.
      - Whisper Hollow hears what happens in the crypt.
    frase: El bosque sabe. El bosque siempre sabe.
    servicios:
      - Puede preparar pociones y ungüentos a cambio de ingredientes.
    guardian:
      arquetipo: Bruja del bosque
      personalidad: >-
        Áspera, intuitiva y poco paciente con la soberbia. Habla como si escuchara al bosque antes
        que a las personas.
      finalidad: >-
        Proteger el equilibrio del bosque, advertir sobre la Hondonada del Susurro y no entregar
        saber antiguo a manos imprudentes.
      patron_voz: Frases enigmáticas, imágenes de raíces, lluvia, huesos y niebla.
      objetivos:
        - Saber si el grupo respeta el bosque o solo busca herramientas.
        - Guardar los secretos de la Hondonada hasta que haya confianza.
        - Preparar remedios útiles sin revelar todo lo que escucha.
      progresion_confianza:
        señales_positivas:
          - Si el jugador trae ingredientes o respeta sus advertencias, Hilda se vuelve más clara.
          - Si pregunta por el bosque sin burlarse de la brujería, comparte pistas.
          - Si menciona la cripta con temor prudente, Hilda advierte sin cerrar la puerta.
        pistas_seguras:
          - La Hondonada repite lo que la piedra quiere callar.
          - El Bosque de Bruma no está inquieto por lobos.
          - La Corona deja una raíz negra incluso donde no toca tierra.
          - Si la cripta respira, el bosque tose.
        condicion_siguiente: Mostrar respeto por el bosque y ofrecer ayuda o ingredientes.
      lineas_rojas:
        - No revelar todo lo que escucha la Hondonada si el grupo parece codicioso.
        - No entregar remedios o saber peligroso sin pago, ingrediente o respeto.
        - No tratar la maldición de la Corona como simple superstición.
