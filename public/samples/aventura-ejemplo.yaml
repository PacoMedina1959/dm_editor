        Painterly high-detail style, clean silhouette, transparent-looking edge, no text, no
        watermark.

        Creature: Araña Tejedora.

        Threat: medio.

        Appearance: Arañas tamaño perro grande. Tejen redes casi invisibles entre vigas..

        Behavior: Emboscadoras. Hilo pegajoso + mordisco paralizante..

        Weakness: Fuego quema las telas. Frágiles ante golpes directos..

        DM extra direction: Araña gigante de cueva, cuerpo oscuro con marcas pálidas, múltiples ojos
        brillantes, patas largas y afiladas, telarañas densas alrededor, gotas de humedad en los
        colmillos, fantasía oscura subterránea, retrato token centrado, silueta clara, sin texto ni
        letras.
      visualScale: 1.4
historia:
  leyenda: >
    Hace trescientos años, el rey Aldaron III unificó los cinco reinos bajo una sola corona forjada
    con el hierro del Corazón de la Montaña y bendecida por los sacerdotes de la Luz Eterna. Quien
    la llevara, gobernaría por derecho divino.
  caida: >
    El último rey, Aldaron V, murió sin herederos durante la Plaga del Velo Negro. Su consejero
    Morath ocultó la corona en una cripta secreta bajo la iglesia de Valdecanto para evitar que
    cayera en manos equivocadas.
  presente: >
    Siglos después, el barón Renard ha encontrado fragmentos del diario de Morath. Obsesionado con
    el poder, ordenó forjar la Llave mágica de la cripta (a Gorin) y envió al Capitán Aldric para
    asegurar la zona.
  secreto_mayor: >
    La corona está maldita. Morath la selló con un ritual de sangre que despertó a los espectros de
    los soldados de Aldaron V. La corona no da poder: consume a quien la porta. Morath fue su
    primera víctima.
artefactos:
  - id: corona_perdida
    nombre: La Corona Perdida
    categoria: artefacto
    canonico: true
    objeto_catalogo: corona_perdida
    descripcion: >
      La Corona Perdida es un artefacto mágico central, no botín menor ni mercancía. Puede convocar
      a tres Espectros Juramentados aliados temporales, pero cada uso aumenta la corrupción de la
      Corona.
    poderes:
      - id: convocar_juramentados
        nombre: Convocar a los Juramentados
        requiere:
          - El personaje posee o porta `corona_perdida`
        efecto: >
          Invoca 3 Espectros Juramentados aliados temporales durante 3 turnos o hasta el final del
          combate.
        coste:
          corrupcion_corona: 1
        limite: 1 vez por escena o combate
        narrativa: >
          La gema oscura de la Corona late una vez, como un corazón bajo tierra. El aire se enfría.
          Tres figuras espectrales emergen del suelo, arrodilladas ante el portador, con espadas
          oxidadas y ojos vacíos. No miran al enemigo: miran primero a quien lleva la Corona,
          esperando una orden.
    corrupcion_corona:
      inicial: 0
      escala:
        - nivel: 0
          descripcion: Sin efecto visible
        - nivel: 1
          descripcion: Susurros leves
        - nivel: 2
          descripcion: Sueños extraños y sensación de ser observado
        - nivel: 3
          descripcion: La Corona empieza a tentar al portador
        - nivel: 4
          descripcion: Los espectros tratan al portador como señor oscuro
        - nivel: 5
          descripcion: Riesgo de final oscuro, posesión o pérdida de control
    restricciones_llm:
      - No permitir convocar espectros si el personaje no posee o porta `corona_perdida`.
      - No permitir usos ilimitados del poder.
      - Los espectros obedecen a la Corona tanto como al portador; no son mascotas inocentes.
      - Cada uso debe sentirse inquietante, poderoso y peligroso.
      - A partir de corrupción alta, mostrar consecuencias narrativas oscuras.
economia:
  recuperacion:
    descripcion: >
      Red de seguridad económica mínima: si el PJ se queda sin dinero, puede buscar trabajo,
      trueque, favor o deuda con NPCs principales. Las recompensas son modestas, requieren causa
      narrativa y no se pueden farmear.
    restricciones_llm:
      - No regalar dinero sin causa narrativa clara.
      - No repetir encargos marcados como no repetibles si su evento ya ocurrió.
      - Recompensas modestas y coherentes con la escena.
      - Si el PJ no tiene dinero, los NPCs pueden ofrecer trabajo, trueque, favor o deuda.
      - No permitir farmear dinero ni convertirlo en botín gratuito.
    encargos:
      - id: trabajo_marta_taberna
        npc: marta
        nombre: Ayudar en la taberna
        descripcion: >
          El PJ ayuda a servir mesas, limpiar, descargar barriles o calmar clientes en la Taberna
          del Jabalí Rojo.
        recompensas:
          - tipo: dinero
            valor: 3 coronas
          - tipo: objeto
            valor: estofado
          - tipo: servicio
            valor: habitacion_noche
        evento_completado: trabajo_marta_completado
        repetible: false
        condicion: Marta debe estar neutral o mejor y no debe haber peligro inmediato.
      - id: encargo_eamon_medicinas
        npc: eamon
        nombre: Ayudar con enfermos o llevar medicinas
        descripcion: >
          El PJ ayuda en la iglesia, atiende enfermos o lleva medicinas a alguien que no puede
          desplazarse.
        recompensas:
          - tipo: objeto
            valor: vendajes
          - tipo: servicio
            valor: servicio_curacion_menor
          - tipo: dinero
            valor: 3 coronas
        evento_completado: encargo_eamon_completado
        repetible: false
        condicion: Eamon debe confiar mínimamente en el grupo.
      - id: ayuda_gorin_herreria
        npc: gorin
        nombre: Ayudar en la herrería
        descripcion: >
          El PJ ayuda a reparar herramientas, mover material pesado o reforjar piezas sencillas en
          la herrería.
        recompensas:
          - tipo: dinero
            valor: 5 coronas
        evento_completado: ayuda_gorin_completada
        repetible: false
        condicion: Gorin debe estar descubierto, liberado o disponible.
      - id: encargo_bertram_informacion
        npc: bertram
        nombre: Encargo de información
        descripcion: >
          El PJ lleva un mensaje, averigua un dato o hace una gestión discreta para Bertram. Puede
          traer problemas sociales.
        recompensas:
          - tipo: dinero
            valor: 5 coronas
          - tipo: informacion
            valor: pista útil
        evento_completado: encargo_bertram_completado
        repetible: false
        riesgo: Puede tener consecuencias sociales o meter al PJ en problemas.
finales:
  - id: destruir_corona
    nombre: Destruir la Corona
    descripcion: >
      El jugador lleva la Corona hasta la Veta del Corazón en la mina abandonada y la funde en la
      fragua original. Los espectros son liberados. Valdecanto queda en paz.
    tono: heroico
    requisitos:
      - Tener la Corona en el inventario
      - Llegar a la Veta del Corazón (mina_veta)
    consecuencias:
      - Espectros liberados definitivamente
      - El barón pierde su objetivo, se retira
      - Valdecanto prospera
  - id: entregar_baron
    nombre: Entregar la Corona al Barón
    descripcion: >
      El jugador entrega la Corona al Capitán Aldric o directamente al barón. El barón enloquece en
      semanas. Valdecanto cae bajo un reinado de terror.
    tono: tragico
    requisitos:
      - Tener la Corona en el inventario
      - Interactuar con Aldric o salir hacia la capital
    consecuencias:
      - El barón enloquece
      - Valdecanto cae bajo un reinado de terror
      - Los espectros siguen activos
  - id: sellar_cripta
    nombre: Sellar la Cripta para Siempre
    descripcion: >
      Convencer al Padre Eamon de realizar el ritual de sellado. La Corona queda enterrada, los
      espectros confinados. Solución temporal.
    tono: agridulce
    requisitos:
      - Confianza del Padre Eamon
      - No haber cogido la Corona
    consecuencias:
      - La cripta queda sellada
      - Los espectros siguen ahí, pero contenidos
      - El barón puede volver a intentarlo en el futuro
  - id: portar_corona
    nombre: Portar la Corona
    descripcion: >
      El jugador se pone la Corona. Siente un poder inmenso... que va consumiéndole turno a turno.
      Final oscuro.
    tono: oscuro
    requisitos:
      - Tener la Corona en el inventario
      - Elegir ponérsela
    consecuencias:
      - Poder temporal enorme
      - Deterioro progresivo del PJ
      - Si no se la quita a tiempo, muere o se convierte en nuevo guardián
escenas:
  - id: 1_llegada
    nombre: Llegada a Valdecanto
    acto: 1
    objetivo: >
      El jugador llega al pueblo, se familiariza con el ambiente tenso y nota que algo va mal.
      Introducir a Marta como primera aliada y plantar las semillas del misterio.
    intencion_dm_default:
      tension: bajo
      tono: acogedor_con_sombras
      ritmo: pausado
      restricciones:
        - NO revelar nada sobre la Corona ni la cripta
        - NO mencionar a Gorin directamente — solo rumores sobre el herrero desaparecido
        - >
          Si el jugador pregunta por Gorin antes de ganarse la confianza de Marta, no respondas con
          una negativa plana ni reveles su paradero. Convierte la restricción en una pista social:
          Marta se tensa, calla, desvía la mirada hacia la puerta de la bodega o corta la
          conversación con una excusa. Insinúa que sabe más de lo que dice y empuja al jugador a
          ganarse su confianza mediante ayuda, respeto o una conversación cuidadosa.
        - >
          Gorin no aparece físicamente ni habla hasta que Marta confíe en el jugador y permita el
          acceso a la bodega.
        - Los guardias son visibles pero no interactúan activamente
    ubicaciones_activas:
      - plaza
      - taberna
      - herreria
      - iglesia
      - cuartel
    npcs_activos:
